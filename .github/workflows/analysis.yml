name: SonarCloud Analysis

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    env:
      BUILD_WRAPPER_OUT_DIR: build_wrapper_output_directory # Directory where build-wrapper output will be placed
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # - name: Install Bear (Linux)
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y bear

      # - name: Verify Bear Installation
      #   run: |
      #     bear --version

      # - name: Generate Compilation Database
      #   run: |
      #     bear -- make clean && make

      - name: Install LLVM/Clang
        env:
          CLANG_VERSION: '19'  # Ubuntu 24.04 (Noble) only supports LLVM 19
        run: |
          sudo bash -c "$(wget -O - https://apt.llvm.org/llvm.sh)" ${{env.CLANG_VERSION}}
          sudo apt install -y \
            clang-${{env.CLANG_VERSION}} \
            clang-tools-${{env.CLANG_VERSION}} \
            libc++-${{env.CLANG_VERSION}}-dev \
            libc++abi-${{env.CLANG_VERSION}}-dev

      - name: Generate compilation database and build
        run: |
          mkdir -p build
          cmake -S . -B build -G Ninja \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++
          cmake --build build --target all

      - name: Verify Compilation Database
        run: |
          if [ ! -f build/compile_commands.json ]; then
            echo "##[error] Compilation database not generated!"
            exit 1
          fi
          cp build/compile_commands.json .
          type compile_commands.json

      - name: Run Tests
        run: |
          gcc -Wall -Wextra -I./include tests/test_converter.c src/converter.c -o tests/test_converter
          ./tests/test_converter

      - name: Install gcovr (Windows)
        run: |
          pip install gcovr

      - name: Build with Coverage (Windows)
        run: |
          gcc -fprofile-arcs -ftest-coverage -Wall -Wextra -I./include \
              src/converter.c tests/test_converter.c -o tests/test_converter.exe

      - name: Run Tests and Generate Coverage (Windows)
        run: |
          .\tests\test_converter.exe
          gcovr --exclude tests/ \
                --root . \
                --xml-pretty \
                --output coverage.xml

      - name: Verify Coverage File
        run: |
          if [ ! -f coverage.xml ]; then
            echo "##[error] Coverage file not generated!"
            exit 1
          fi
          type coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.projectKey=minhazul73_Temp2temP
            -Dsonar.organization=minhazul73
            -Dsonar.cfamily.compile-commands=compile_commands.json
            -Dsonar.coverageReportPaths=coverage.xml
            -Dsonar.c.file.suffixes=.c,.h
            -Dsonar.language=c
            -Dsonar.sources=src
            -Dsonar.tests=tests